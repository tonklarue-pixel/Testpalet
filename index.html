<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Warehouse Management (Custom Modal)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Three.js, OrbitControls & GSAP -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Firebase SDK v9 (Compat) -->

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        * { touch-action: manipulation; box-sizing: border-box; }
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0; padding: 0;
            overflow: hidden;
            background-color: #070d1b;
            color: #f1f5f9;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0; z-index: 1;
            touch-action: none;
        }
        .clean-glass {
            background: rgba(11, 19, 38, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 4px; }
    </style>
</head>
<body class="relative min-h-screen">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- Custom Modal Dialog (Prompt Replacer) -->
    <div id="custom-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="clean-glass w-full max-w-sm p-5 rounded-3xl flex flex-col gap-4 border border-indigo-500/20 shadow-2xl scale-95 transition-transform duration-200" id="modal-box">
            <div class="flex items-center gap-3">

                </div>
            </div>
            
            <input type="text" id="modal-input" placeholder="เช่น พาเลท D (โซน A)" 
                class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
            
            <div class="flex gap-2 pt-1">
                <button id="modal-btn-cancel" class="flex-1 bg-slate-800/80 hover:bg-slate-700 text-slate-300 text-xs font-medium py-2.5 rounded-2xl transition border border-slate-700">ยกเลิก</button>
                <button id="modal-btn-ok" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium py-2.5 rounded-2xl transition shadow-lg shadow-indigo-600/30">ยืนยัน</button>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 p-3 md:p-5 pointer-events-none flex flex-col justify-between h-screen max-w-full">
        
        <!-- Header -->
        <div class="flex flex-wrap justify-between items-center gap-3 pointer-events-auto">
            <div class="clean-glass px-4 py-2.5 rounded-2xl flex items-center gap-3">
                <div class="p-2 bg-gradient-to-tr from-indigo-600 to-violet-600 rounded-xl shadow-md">
                    <i data-lucide="box" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <h1 class="font-semibold text-sm leading-tight text-white">ระบบคลังสินค้า 3D</h1>
                    <p class="text-[11px] text-slate-400">พิกัดอัตโนมัติ Pallet-Slot-Layer</p>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <!-- Mode Switcher -->
                <div class="clean-glass p-1 rounded-2xl flex items-center gap-1">
                    <button id="btn-mode-rotate" class="px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 transition bg-indigo-600 text-white shadow">
                        <i data-lucide="rotate-3d" class="w-3.5 h-3.5"></i> หมุนกล้อง

                    <button id="btn-mode-drag" class="px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 transition text-slate-400 hover:text-white">
                        <i data-lucide="move" class="w-3.5 h-3.5"></i> ลากย้าย

                <div id="status-badge" class="clean-glass px-3 py-2 rounded-2xl hidden sm:flex items-center gap-2 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span class="text-slate-300 text-[11px]">เชื่อมต่อระบบ...</span>
                </div>
            </div>
        </div>

        <!-- Main Controls & Panel -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-3 pointer-events-auto items-end pb-1">
            
            <!-- Left Panel: Form & Search -->
            <div class="md:col-span-5 lg:col-span-4 clean-glass p-4 rounded-3xl flex flex-col gap-3.5 max-h-[45vh] md:max-h-[75vh] overflow-y-auto custom-scrollbar">
                
                <!-- Search Input -->
                <div class="flex flex-col gap-1.5">
                    <div class="relative">
                        <input type="text" id="search-input" placeholder="ค้นหาชื่อแฟ้ม หรือรหัสพิกัด (เช่น P1-S1)..." 
                            class="w-full bg-slate-900/60 border border-slate-700/60 rounded-2xl px-3.5 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 pr-8 transition">
                        <button id="search-clear" class="absolute right-3 top-2.5 text-slate-400 hover:text-white hidden">
                            <i data-lucide="x" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <div id="search-results-list" class="flex flex-col gap-1 max-h-24 overflow-y-auto custom-scrollbar hidden"></div>
                </div>

                <!-- Add Form -->
                <div class="flex flex-col gap-2.5 pt-1 border-t border-slate-800/80">
                    <h2 class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="plus-circle" class="w-3.5 h-3.5 text-indigo-400"></i> เพิ่มกล่องเข้าคลัง
                    </h2>
                    
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] text-slate-400">เลือกพาเลท</label>
                        <select id="select-pallet" class="bg-slate-900/60 border border-slate-700/60 rounded-2xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500 transition">

                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] text-slate-400">ตำแหน่ง (Slot)</label>
                            <select id="select-slot" class="bg-slate-900/60 border border-slate-700/60 rounded-2xl px-3 py-2 text-xs text-amber-300 font-medium focus:outline-none focus:border-indigo-500 transition">
                                <option value="0">ช่อง 1 (ซ้ายบน)</option>
                                <option value="1">ช่อง 2 (ขวาบน)</option>
                                <option value="2">ช่อง 3 (ซ้ายล่าง)</option>
                                <option value="3">ช่อง 4 (ขวาล่าง)</option>
                            </select>
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-[10px] text-slate-400">ชื่อข้างกล่อง</label>
                            <input type="text" id="input-box-label" placeholder="แฟ้มบัญชี 67" 
                                class="bg-slate-900/60 border border-slate-700/60 rounded-2xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button id="btn-add-box" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-xs font-medium py-2 px-3 rounded-2xl flex items-center justify-center gap-1.5 transition shadow-lg shadow-indigo-600/20">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i> เพิ่มกล่อง
                        </button>
                        <button id="btn-add-pallet" class="bg-slate-800/80 hover:bg-slate-700 text-slate-200 text-xs font-medium py-2 px-3 rounded-2xl border border-slate-700/60 flex items-center justify-center gap-1.5 transition">
                            <i data-lucide="layer-plus" class="w-3.5 h-3.5 text-cyan-400"></i> เพิ่มพาเลท
                        </button>
                    </div>
                </div>

                <!-- Footer Quick Actions -->
                <div class="flex justify-between items-center pt-2 border-t border-slate-800/80 text-xs text-slate-400">
                    <span id="pallet-count-badge" class="font-medium text-slate-300">0 พาเลท</span>
                    <div class="flex items-center gap-1">
                        <button id="btn-export" title="สำรองข้อมูล JSON" class="p-2 hover:bg-slate-800 rounded-xl transition text-slate-300"><i data-lucide="download" class="w-3.5 h-3.5"></i></button>
                        <button id="btn-import-trigger" title="นำเข้าข้อมูล" class="p-2 hover:bg-slate-800 rounded-xl transition text-slate-300"><i data-lucide="upload" class="w-3.5 h-3.5"></i></button>
                        <input type="file" id="file-import" accept=".json" class="hidden">
                        <button id="btn-clear-all" title="ล้างทั้งหมด" class="p-2 hover:bg-rose-900/30 rounded-xl transition text-rose-400"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>

            </div>

            <!-- Right Panel: Coordinate Summary -->
            <div class="md:col-span-7 lg:col-span-8 clean-glass p-4 rounded-3xl shadow-2xl max-h-[35vh] md:max-h-[75vh] overflow-y-auto custom-scrollbar flex flex-col gap-2.5">
                <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                    <h2 class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-cyan-400"></i> รายการพิกัดและกล่องทั้งหมด
                    </h2>
                    <span class="text-[10px] text-slate-400">คลิกตา 👁️ เพื่อซูมดูพาเลท</span>
                </div>

                <div id="pallet-list-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 pt-0.5">

    <!-- Main Logic Script -->
    <script>
        function renderIcons() {
            if (typeof lucide !== 'undefined' && lucide.createIcons) {
                lucide.createIcons();
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBX_HkxQttRGlZ81UaE3fsWtJLQb9MBQqw",
            authDomain: "gen-lang-client-0163925046.firebaseapp.com",
            projectId: "gen-lang-client-0163925046",
            storageBucket: "gen-lang-client-0163925046.firebasestorage.app",
            messagingSenderId: "965044714461",
            appId: "1:965044714461:web:ae3b0baf227e4b03975434",
            measurementId: "G-EQDGSMGTFJ"
        };

        let db = null;
        let isFirebaseLive = false;
        let palletsData = [];
        let highlightedBoxIds = new Set();
        let textureCache = new Map();

        let scene, camera, renderer, controls, raycaster, mouse;
        let pallet3DGroup = new THREE.Group();
        let boxMeshMap = new Map();

        let currentMode = 'rotate';
        let isDragging = false;
        let draggedMesh = null;
        let dragPlane = new THREE.Plane();
        let planeIntersect = new THREE.Vector3();
        let dragOffset = new THREE.Vector3();
        let originalBoxPosition = new THREE.Vector3();

        const PALLET_WIDTH = 3.6;
        const PALLET_LENGTH = 3.6;
        const PALLET_HEIGHT = 0.4;
        const BOX_WIDTH = 1.6;
        const BOX_LENGTH = 1.6;
        const BOX_HEIGHT = 1.2;
        const BOX_GAP = 0.15;
        const GRID_COLS = 3;
        const SPACING_X = 5.5;
        const SPACING_Z = 5.5;

        const LOCAL_SLOT_OFFSETS = [
            { x: -(BOX_WIDTH / 2 + BOX_GAP / 2), z: -(BOX_LENGTH / 2 + BOX_GAP / 2) },
            { x:  (BOX_WIDTH / 2 + BOX_GAP / 2), z: -(BOX_LENGTH / 2 + BOX_GAP / 2) },
            { x: -(BOX_WIDTH / 2 + BOX_GAP / 2), z:  (BOX_LENGTH / 2 + BOX_GAP / 2) },
            { x:  (BOX_WIDTH / 2 + BOX_GAP / 2), z:  (BOX_LENGTH / 2 + BOX_GAP / 2) }
        ];

        const LAYER_COLORS = [
            0x3b82f6, 0x10b981, 0xf59e0b, 0x8b5cf6, 0xec4899, 0x06b6d4
        ];

        // Custom Modal Prompt Handler
        function showCustomPrompt(title, desc, defaultValue, callback) {
            const modal = document.getElementById('custom-modal');
            const modalBox = document.getElementById('modal-box');
            const titleEl = document.getElementById('modal-title');
            const descEl = document.getElementById('modal-desc');
            const inputEl = document.getElementById('modal-input');
            const btnOk = document.getElementById('modal-btn-ok');
            const btnCancel = document.getElementById('modal-btn-cancel');

            titleEl.textContent = title;
            descEl.textContent = desc;
            inputEl.value = defaultValue;

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalBox.classList.remove('scale-95');
                inputEl.focus();
                inputEl.select();
            }, 10);

            function closeModel(result) {
                modal.classList.add('opacity-0');
                modalBox.classList.add('scale-95');
                setTimeout(() => {
                    modal.classList.add('hidden');
                    btnOk.onclick = null;
                    btnCancel.onclick = null;
                    inputEl.onkeypress = null;
                    if (callback) callback(result);
                }, 200);
            }

            btnOk.onclick = () => closeModel(inputEl.value.trim());
            btnCancel.onclick = () => closeModel(null);
            inputEl.onkeypress = (e) => {
                if (e.key === 'Enter') closeModel(inputEl.value.trim());
            };
        }

        function initFirebase() {
            const statusBadge = document.getElementById('status-badge');
            try {
                if (typeof firebase !== 'undefined' && !firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                    db = firebase.firestore();
                    isFirebaseLive = true;
                    
                    if (statusBadge) {
                        statusBadge.innerHTML = `
                            <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                            <span class="text-slate-200 text-[11px]">Cloud Live</span>
                        `;
                    }

                    db.collection('warehouse_system').doc('current_state')
                      .onSnapshot((doc) => {
                          if (doc.exists && doc.data().pallets) {
                              palletsData = doc.data().pallets;
                          } else {
                              if (palletsData.length === 0) createInitialData();
                          }
                          updateAll();
                      }, (err) => {
                          enableLocalStorageFallback();
                      });
                } else {
                    enableLocalStorageFallback();
                }
            } catch (error) {
                enableLocalStorageFallback();
            }
        }

        function enableLocalStorageFallback() {
            isFirebaseLive = false;
            const statusBadge = document.getElementById('status-badge');
            if (statusBadge) {
                statusBadge.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-amber-400"></span>
                    <span class="text-slate-200 text-[11px]">Local Mode</span>
                `;
            }
            loadFromLocalStorage();
        }

        function createInitialData() {
            palletsData = [
                { id: 'P1', name: 'พาเลท A (โซน 1)', boxes: [] },
                { id: 'P2', name: 'พาเลท B (โซน 1)', boxes: [] },
                { id: 'P3', name: 'พาเลท C (โซน 2)', boxes: [] }
            ];
            saveData();
        }

        function saveData() {
            if (isFirebaseLive && db) {
                db.collection('warehouse_system').doc('current_state').set({
                    pallets: palletsData,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => {
                    saveToLocalStorage();
                });
            } else {
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('warehouse_system_data', JSON.stringify(palletsData));
            updateAll();
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('warehouse_system_data');
            if (saved) {
                try {
                    palletsData = JSON.parse(saved);
                } catch(e) {
                    createInitialData();
                }
            } else {
                createInitialData();
            }
            updateAll();
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x070d1b);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 26);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
            dirLight.position.set(15, 25, 15);
            scene.add(dirLight);

            const gridHelper = new THREE.GridHelper(60, 30, 0x38bdf8, 0x1e293b);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            scene.add(pallet3DGroup);

            const dom = renderer.domElement;
            dom.addEventListener('pointerdown', handleStart);
            dom.addEventListener('pointermove', handleMove);
            dom.addEventListener('pointerup', handleEnd);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function getCachedLabelTexture(text) {
            if (textureCache.has(text)) return textureCache.get(text);

            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 128);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#3b82f6';
            ctx.strokeRect(0, 0, 256, 128);

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 20px Prompt, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const truncatedText = text.length > 14 ? text.substring(0, 12) + '..' : text;
            ctx.fillText(truncatedText, 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            textureCache.set(text, texture);
            return texture;
        }

        function render3DScene() {
            while(pallet3DGroup.children.length > 0) { 
                const obj = pallet3DGroup.children[0];
                pallet3DGroup.remove(obj);
            }
            boxMeshMap.clear();

            palletsData.forEach((pallet, pIndex) => {
                const col = pIndex % GRID_COLS;
                const row = Math.floor(pIndex / GRID_COLS);
                const posX = (col - 1) * SPACING_X;
                const posZ = row * SPACING_Z;

                const palletMesh = createPalletMesh(PALLET_WIDTH, PALLET_HEIGHT, PALLET_LENGTH);
                palletMesh.position.set(posX, PALLET_HEIGHT / 2, posZ);
                pallet3DGroup.add(palletMesh);

                const slotCounts = [0, 0, 0, 0];

                (pallet.boxes || []).forEach((box) => {
                    const slotIdx = box.slot !== undefined ? box.slot : 0;
                    const layerIdx = slotCounts[slotIdx];
                    slotCounts[slotIdx]++;

                    box.code = `${pallet.id}-S${slotIdx + 1}-L${layerIdx + 1}`;

                    const boxX = posX + LOCAL_SLOT_OFFSETS[slotIdx].x;
                    const boxY = PALLET_HEIGHT + (layerIdx * BOX_HEIGHT) + (BOX_HEIGHT / 2);
                    const boxZ = posZ + LOCAL_SLOT_OFFSETS[slotIdx].z;

                    const colorHex = LAYER_COLORS[layerIdx % LAYER_COLORS.length];
                    const boxMesh = createBoxMesh(BOX_WIDTH, BOX_HEIGHT, BOX_LENGTH, colorHex, box.label || 'ลัง');
                    
                    boxMesh.position.set(boxX, boxY, boxZ);
                    boxMesh.userData = { 
                        boxId: box.id, 
                        palletId: pallet.id, 
                        label: box.label,
                        code: box.code,
                        originalColor: colorHex,
                        isBox: true
                    };

                    pallet3DGroup.add(boxMesh);
                    boxMeshMap.set(box.id, boxMesh);
                });
            });
        }

        function createPalletMesh(w, h, l) {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshLambertMaterial({ color: 0xc2410c });

            const plankCount = 5;
            const plankWidth = w / plankCount - 0.05;
            for(let i=0; i<plankCount; i++) {
                const plankGeo = new THREE.BoxGeometry(plankWidth, 0.08, l);
                const plank = new THREE.Mesh(plankGeo, woodMat);
                plank.position.x = -w/2 + plankWidth/2 + i * (plankWidth + 0.05);
                plank.position.y = h/2 - 0.04;
                group.add(plank);
            }

            const blockGeo = new THREE.BoxGeometry(w, h - 0.08, l * 0.2);
            const block = new THREE.Mesh(blockGeo, woodMat);
            block.position.y = -0.04;
            group.add(block);

            return group;
        }

        function createBoxMesh(w, h, l, colorHex, labelText) {
            const geometry = new THREE.BoxGeometry(w, h, l);
            const material = new THREE.MeshLambertMaterial({ color: colorHex, transparent: true, opacity: 1.0 });

            const mesh = new THREE.Mesh(geometry, material);

            const edges = new THREE.EdgesGeometry(geometry);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x0f172a });
            const line = new THREE.LineSegments(edges, lineMat);
            mesh.add(line);

            const texture = getCachedLabelTexture(labelText);
            const labelGeo = new THREE.PlaneGeometry(w * 0.85, h * 0.55);
            const labelMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });

            const labelFront = new THREE.Mesh(labelGeo, labelMat);
            labelFront.position.z = l / 2 + 0.01;
            mesh.add(labelFront);

            return mesh;
        }

        function handleStart(event) {
            if (currentMode !== 'drag') return;
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (!clientX || !clientY) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(pallet3DGroup.children, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj && !obj.userData.isBox && obj.parent && obj !== pallet3DGroup) {
                    obj = obj.parent;
                }
                if (obj && obj.userData.isBox) {
                    isDragging = true;
                    draggedMesh = obj;
                    originalBoxPosition.copy(draggedMesh.position);
                    dragPlane.setFromNormalAndCoplanarPoint(new THREE.Vector3(0, 1, 0), draggedMesh.position);

                    if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                        dragOffset.subVectors(draggedMesh.position, planeIntersect);
                    }
                    draggedMesh.position.y += 0.5;
                    showToast(`ย้าย: ${draggedMesh.userData.label}`);
                }
            }
        }

        function handleMove(event) {
            if (!isDragging || !draggedMesh) return;
            const clientX = event.clientX || (event.touches && event.touches[0].clientX);
            const clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (!clientX || !clientY) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                draggedMesh.position.x = planeIntersect.x + dragOffset.x;
                draggedMesh.position.z = planeIntersect.z + dragOffset.z;
            }
        }

        function handleEnd() {
            if (!isDragging || !draggedMesh) return;
            isDragging = false;
            hideToast();

            let closestPallet = null, minDistance = Infinity;
            palletsData.forEach((pallet, pIndex) => {
                const col = pIndex % GRID_COLS, row = Math.floor(pIndex / GRID_COLS);
                const posX = (col - 1) * SPACING_X, posZ = row * SPACING_Z;
                const distance = Math.hypot(draggedMesh.position.x - posX, draggedMesh.position.z - posZ);
                if (distance < minDistance) { minDistance = distance; closestPallet = pallet; }
            });

            if (closestPallet && minDistance < 3.2) {
                const pIdx = palletsData.findIndex(p => p.id === closestPallet.id);
                const col = pIdx % GRID_COLS, row = Math.floor(pIdx / GRID_COLS);
                const palletCenterX = (col - 1) * SPACING_X, palletCenterZ = row * SPACING_Z;

                let closestSlot = 0, minSlotDist = Infinity;
                LOCAL_SLOT_OFFSETS.forEach((slotOffset, sIdx) => {
                    const d = Math.hypot(draggedMesh.position.x - (palletCenterX + slotOffset.x), draggedMesh.position.z - (palletCenterZ + slotOffset.z));
                    if (d < minSlotDist) { minSlotDist = d; closestSlot = sIdx; }
                });

                transferBox(draggedMesh.userData.palletId, closestPallet.id, draggedMesh.userData.boxId, closestSlot);
            } else {
                draggedMesh.position.copy(originalBoxPosition);
            }
            draggedMesh = null;
        }

        function transferBox(fromP, toP, boxId, newSlot) {
            let movedBox = null;
            const src = palletsData.find(p => p.id === fromP);
            if (src && src.boxes) {
                src.boxes = src.boxes.filter(b => {
                    if (b.id === boxId) { movedBox = b; return false; }
                    return true;
                });
            }
            const tgt = palletsData.find(p => p.id === toP);
            if (tgt && movedBox) {
                movedBox.slot = newSlot;
                if (!tgt.boxes) tgt.boxes = [];
                tgt.boxes.push(movedBox);
                saveData();
            }
        }

        function showToast(text) {
            const t = document.getElementById('drag-toast');
            document.getElementById('drag-toast-text').textContent = text;
            t.classList.remove('opacity-0', '-translate-y-2');
            t.classList.add('opacity-100', 'translate-y-0');
        }

        function hideToast() {
            const t = document.getElementById('drag-toast');
            t.classList.remove('opacity-100', 'translate-y-0');
            t.classList.add('opacity-0', '-translate-y-2');
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls && currentMode === 'rotate') controls.update();

            searchPulseTime += 0.05;
            const query = document.getElementById('search-input')?.value.trim().toLowerCase() || '';

            boxMeshMap.forEach((mesh, boxId) => {
                if (mesh === draggedMesh) return;
                if (query.length > 0) {
                    if (highlightedBoxIds.has(boxId)) {
                        mesh.material.color.setHex(0xfacc15);
                        mesh.material.opacity = 1.0;
                    } else {
                        mesh.material.color.setHex(mesh.userData.originalColor);
                        mesh.material.opacity = 0.2;
                    }
                } else {
                    mesh.material.color.setHex(mesh.userData.originalColor);
                    mesh.material.opacity = 1.0;
                }
            });

            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        let searchPulseTime = 0;

        function updateAll() {
            render3DScene();
            updateUI();
            handleSearch();
        }

        function updateUI() {
            const selectPallet = document.getElementById('select-pallet');
            if (!selectPallet) return;
            selectPallet.innerHTML = '';

            if (palletsData.length === 0) {
                selectPallet.add(new Option('-- เพิ่มพาเลทก่อน --', ''));
            } else {
                palletsData.forEach(p => selectPallet.add(new Option(`${p.name} (${p.boxes?.length || 0} ลัง)`, p.id)));
            }

            document.getElementById('pallet-count-badge').textContent = `${palletsData.length} พาเลท`;
            const container = document.getElementById('pallet-list-container');
            container.innerHTML = '';

            palletsData.forEach((pallet) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/50 border border-slate-800/80 rounded-2xl p-3 flex flex-col gap-2 transition hover:border-slate-700";

                const boxCount = pallet.boxes?.length || 0;
                let boxesHTML = boxCount === 0 ? `<p class="text-[11px] text-slate-500 italic py-1">ไม่มีลังในพาเลทนี้</p>` : '';

                if (boxCount > 0) {
                    const slotCounts = [0, 0, 0, 0];
                    boxesHTML = pallet.boxes.map((b) => {
                        const slotIdx = b.slot !== undefined ? b.slot : 0;
                        const code = `${pallet.id}-S${slotIdx + 1}-L${slotCounts[slotIdx] + 1}`;
                        slotCounts[slotIdx]++;

                        return `
                            <div class="flex justify-between items-center text-xs bg-slate-900/80 px-2.5 py-1.5 rounded-xl border border-slate-800">
                                <div class="truncate mr-1">
                                    <span class="text-slate-200 font-medium truncate block text-[11px]">${b.label}</span>
                                    <span class="text-[10px] text-amber-400 font-mono">[${code}]</span>
                                </div>
                                <div class="flex items-center gap-1 shrink-0">
                                    <button onclick="moveBoxPrompt('${pallet.id}', '${b.id}')" class="text-indigo-400 hover:text-indigo-300 p-1"><i data-lucide="repeat" class="w-3.5 h-3.5"></i></button>
                                    <button onclick="removeBox('${pallet.id}', '${b.id}')" class="text-rose-400 hover:text-rose-300 p-1"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                        <div>
                            <h3 class="text-xs font-semibold text-slate-200">${pallet.name}</h3>
                            <p class="text-[10px] text-slate-400">${boxCount} ลังเอกสาร</p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="focusPallet('${pallet.id}')" class="p-1.5 text-slate-400 hover:text-indigo-400 transition"><i data-lucide="eye" class="w-3.5 h-3.5"></i></button>
                            <button onclick="removePallet('${pallet.id}')" class="p-1.5 text-slate-400 hover:text-rose-400 transition"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5 max-h-28 overflow-y-auto custom-scrollbar pr-0.5">
                        ${boxesHTML}
                    </div>
                `;
                container.appendChild(card);
            });
            renderIcons();
        }

        function addPallet() {
            showCustomPrompt("เพิ่มพาเลทใหม่", "ระบุชื่อพาเลทหรือโซนจัดเก็บ:", `พาเลท ${String.fromCharCode(65 + palletsData.length)}`, (name) => {
                if (!name) return;
                palletsData.push({ id: 'P' + (palletsData.length + 1), name: name.trim(), boxes: [] });
                saveData();
            });
        }

        function removePallet(id) {
            if (!confirm("ลบพาเลทนี้พร้อมกล่องทั้งหมด?")) return;
            palletsData = palletsData.filter(p => p.id !== id);
            saveData();
        }

        function addBox() {
            const palletId = document.getElementById('select-pallet').value;
            const slotIdx = parseInt(document.getElementById('select-slot').value, 10);
            const label = document.getElementById('input-box-label').value.trim();

            if (!palletId) { alert("กรุณาเพิ่มพาเลทก่อน"); return; }
            if (!label) { alert("กรุณากรอกชื่อข้างกล่อง"); return; }

            const pallet = palletsData.find(p => p.id === palletId);
            if (pallet) {
                if (!pallet.boxes) pallet.boxes = [];
                pallet.boxes.push({ id: 'B_' + Date.now(), label, slot: slotIdx });
                document.getElementById('input-box-label').value = '';
                saveData();
            }
        }

        function removeBox(palletId, boxId) {
            const pallet = palletsData.find(p => p.id === palletId);
            if (pallet && pallet.boxes) {
                pallet.boxes = pallet.boxes.filter(b => b.id !== boxId);
                saveData();
            }
        }

        function moveBoxPrompt(fromP, boxId) {
            showCustomPrompt("ย้ายตำแหน่งกล่อง", "ระบุ ID หรือชื่อพาเลทปลายทาง:", palletsData[0]?.id || "", (targetId) => {
                if (!targetId) return;
                const tgt = palletsData.find(p => p.id === targetId || p.name.includes(targetId));
                if (!tgt) { alert("ไม่พบพาเลทปลายทาง"); return; }
                
                showCustomPrompt("เลือกช่องวาง", "เลือกช่องบนพาเลทใหม่ (กรอกเลข 1, 2, 3 หรือ 4):", "1", (slotStr) => {
                    const slot = parseInt(slotStr, 10) - 1;
                    transferBox(fromP, tgt.id, boxId, Math.max(0, Math.min(3, slot || 0)));
                });
            });
        }

        function handleSearch() {
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');
            const resultsList = document.getElementById('search-results-list');
            if (!searchInput) return;

            const query = searchInput.value.trim().toLowerCase();
            highlightedBoxIds.clear();
            resultsList.innerHTML = '';

            if (query.length > 0) {
                searchClear.classList.remove('hidden');
                resultsList.classList.remove('hidden');
                let match = 0;

                palletsData.forEach(pallet => {
                    const slotCounts = [0, 0, 0, 0];
                    (pallet.boxes || []).forEach(box => {
                        const sIdx = box.slot !== undefined ? box.slot : 0;
                        const code = `${pallet.id}-S${sIdx + 1}-L${slotCounts[sIdx] + 1}`.toLowerCase();
                        slotCounts[sIdx]++;

                        if (box.label.toLowerCase().includes(query) || code.includes(query)) {
                            highlightedBoxIds.add(box.id);
                            match++;
                            const item = document.createElement('div');
                            item.className = "flex justify-between items-center bg-slate-900/90 hover:bg-slate-800 px-3 py-1.5 rounded-xl text-xs cursor-pointer transition border border-slate-800";
                            item.onclick = () => focusPallet(pallet.id);
                            item.innerHTML = `<span class="text-amber-300 font-medium">${box.label} <span class="text-[10px] text-cyan-400">[${code.toUpperCase()}]</span></span><i data-lucide="target" class="w-3.5 h-3.5 text-indigo-400"></i>`;
                            resultsList.appendChild(item);
                        }
                    });
                });
                if (match === 0) resultsList.innerHTML = `<p class="text-[11px] text-slate-500 italic p-1 text-center">ไม่พบผลการค้นหา</p>`;
            } else {
                searchClear.classList.add('hidden');
                resultsList.classList.add('hidden');
            }
            renderIcons();
        }

        function focusPallet(palletId) {
            const pIdx = palletsData.findIndex(p => p.id === palletId);
            if (pIdx === -1) return;
            const targetX = ((pIdx % GRID_COLS) - 1) * SPACING_X;
            const targetZ = Math.floor(pIdx / GRID_COLS) * SPACING_Z;

            gsap.to(camera.position, { x: targetX, y: 8, z: targetZ + 12, duration: 1, ease: "power2.inOut" });
            gsap.to(controls.target, { x: targetX, y: 1.5, z: targetZ, duration: 1, ease: "power2.inOut" });
        }

        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(palletsData, null, 2));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", `warehouse_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(a); a.click(); a.remove();
        }

        function importJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = JSON.parse(evt.target.result);
                    if (Array.isArray(data)) { palletsData = data; saveData(); alert("นำเข้าข้อมูลสำเร็จ!"); }
                } catch(err) { alert("ไฟล์ JSON ไม่ถูกต้อง"); }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm("ล้างข้อมูลทั้งหมดในคลัง?")) { palletsData = []; saveData(); }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnR = document.getElementById('btn-mode-rotate');
            const btnD = document.getElementById('btn-mode-drag');
            if (mode === 'rotate') {
                controls.enabled = true;
                btnR.className = "px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 transition bg-indigo-600 text-white shadow";
                btnD.className = "px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 transition text-slate-400 hover:text-white";
            } else {
                controls.enabled = false;
                btnD.className = "px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 transition bg-indigo-600 text-white shadow";
                btnR.className = "px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 transition text-slate-400 hover:text-white";
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            init3D();
            initFirebase();

            document.getElementById('btn-mode-rotate').addEventListener('click', () => setMode('rotate'));
            document.getElementById('btn-mode-drag').addEventListener('click', () => setMode('drag'));
            document.getElementById('btn-add-pallet').addEventListener('click', addPallet);
            document.getElementById('btn-add-box').addEventListener('click', addBox);
            
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');
            searchInput.addEventListener('input', handleSearch);
            searchClear.addEventListener('click', () => { searchInput.value = ''; handleSearch(); });
            searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') addBox(); });

            document.getElementById('btn-export').addEventListener('click', exportJSON);
            document.getElementById('btn-import-trigger').addEventListener('click', () => document.getElementById('file-import').click());
            document.getElementById('file-import').addEventListener('change', importJSON);
            document.getElementById('btn-clear-all').addEventListener('click', clearAllData);

            renderIcons();
        });
    </script>
</body>
</html>
