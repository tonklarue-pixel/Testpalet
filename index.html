<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pallet & File Box Stacking Manager (Cloud Live + Search)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Firebase SDK v9 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Prompt', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 116, 139, 1);
        }
    </style>
</head>
<body class="relative min-h-screen">

    <!-- 3D Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div class="relative z-10 p-4 md:p-6 pointer-events-none flex flex-col justify-between h-screen max-w-full">
        
        <!-- Header & Status Bar -->
        <div class="flex flex-wrap justify-between items-center gap-4 pointer-events-auto">
            <div class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-3 shadow-2xl">
                <div class="p-2 bg-indigo-600 rounded-xl">
                    <i data-lucide="boxes" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                        ระบบจัดเรียงลังแฟ้ม 3D
                    </h1>
                    <p class="text-xs text-slate-400">4 ลัง/ชั้น ซ้อนได้ไม่จำกัด (2x2 Grid)</p>
                </div>
            </div>

            <!-- Connection Status & System Actions -->
            <div class="flex items-center gap-3">
                <div id="status-badge" class="glass-panel px-4 py-2 rounded-xl flex items-center gap-2 text-xs font-semibold shadow-lg">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                    <span class="text-amber-400">กำลังเชื่อมต่อ...</span>
                </div>

                <div class="glass-panel p-1.5 rounded-xl flex items-center gap-1 shadow-lg">
                    <button id="btn-export" title="ส่งออก JSON" class="p-2 hover:bg-slate-700/60 rounded-lg text-slate-300 hover:text-white transition">
                        <i data-lucide="download" class="w-4 h-4"></i>
                    </button>
                    <button id="btn-import-trigger" title="นำเข้า JSON" class="p-2 hover:bg-slate-700/60 rounded-lg text-slate-300 hover:text-white transition">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                    </button>
                    <input type="file" id="file-import" accept=".json" class="hidden">
                    <button id="btn-clear-all" title="ล้างข้อมูลทั้งหมด" class="p-2 hover:bg-rose-900/40 text-rose-400 hover:text-rose-300 rounded-lg transition">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>

                </div>
            </div>
        </div>

        <!-- Sidebar / Bottom Controls -->
        <div class="grid grid-cols-1 md:grid-cols-12 gap-4 pointer-events-auto items-end pb-2">
            
            <!-- Left Control Panel: Add Pallet & Boxes + Search -->
            <div class="md:col-span-5 lg:col-span-4 glass-panel p-5 rounded-2xl shadow-2xl flex flex-col gap-4 max-h-[80vh] overflow-y-auto custom-scrollbar">
                
                <!-- Search Box Feature -->
                <div class="flex flex-col gap-2 border-b border-slate-700/60 pb-4">
                    <label class="text-xs font-semibold text-cyan-400 flex items-center gap-1.5">
                        <i data-lucide="search" class="w-3.5 h-3.5"></i> ค้นหาชื่อข้างกล่อง

                    <div class="relative">

                            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 pr-8 transition">
                        <button id="search-clear" class="absolute right-2.5 top-2.5 text-slate-400 hover:text-white hidden">

                    <div class="flex flex-col gap-1.5">

                            <!-- Populated dynamically -->
                        </select>
                    </div>

                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs text-slate-400">ชื่อข้างกล่อง / รหัสเอกสาร</label>
                        <input type="text" id="input-box-label" placeholder="ตัวอย่าง: แฟ้มบัญชี 2567/01" 
                            class="bg-slate-900/80 border border-slate-700 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <button id="btn-add-box" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2 transition shadow-lg shadow-indigo-600/30">
                            <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มกล่อง
                        </button>
                        <button id="btn-add-pallet" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium py-2.5 px-4 rounded-xl border border-slate-700 flex items-center justify-center gap-2 transition">
                            <i data-lucide="layer-plus" class="w-4 h-4 text-cyan-400"></i> เพิ่มพาเลท

                <!-- Instructions -->
                <div class="text-[11px] text-slate-400 bg-slate-900/40 p-3 rounded-xl border border-slate-800/80 flex flex-col gap-1">
                    <div class="font-medium text-slate-300">💡 การจัดวางกล่อง:</div>
                    <div>• แต่ละพาเลทจะเรียงเป็นตาราง 2x2 (4 ลังต่อชั้น)</div>
                    <div>• กล่องใบที่ 5 ขึ้นไปจะถูกวางซ้อนทับขึ้นชั้นถัดไปอัตโนมัติ</div>
                </div>

            </div>

            <!-- Right Panel: Inventory Quick Summary -->
            <div class="md:col-span-7 lg:col-span-8 glass-panel p-5 rounded-2xl shadow-2xl max-h-[40vh] md:max-h-[80vh] overflow-y-auto custom-scrollbar flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                    <h2 class="text-sm font-semibold text-slate-200 flex items-center gap-2">
                        <i data-lucide="list" class="w-4 h-4 text-cyan-400"></i> สรุปรายการพาเลทและลังแฟ้ม
                    </h2>
                    <span id="pallet-count-badge" class="text-xs bg-indigo-950 text-indigo-300 border border-indigo-800 px-2.5 py-0.5 rounded-full font-medium">
                        0 พาเลท
                    </span>
                </div>

                <div id="pallet-list-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 pt-1">
                    <!-- Dynamic Pallet Cards -->
                </div>
            </div>

        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // --- 1. Firebase Configuration (Provided Credentials) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBX_HkxQttRGlZ81UaE3fsWtJLQb9MBQqw",
            authDomain: "gen-lang-client-0163925046.firebaseapp.com",
            projectId: "gen-lang-client-0163925046",
            storageBucket: "gen-lang-client-0163925046.firebasestorage.app",
            messagingSenderId: "965044714461",
            appId: "1:965044714461:web:ae3b0baf227e4b03975434",
            measurementId: "G-EQDGSMGTFJ"
        };

        // Global State & System Variables
        let db = null;
        let isFirebaseLive = false;
        let palletsData = [];
        let highlightedBoxIds = new Set();
        let searchPulseTime = 0;

        // 3D Engine Variables
        let scene, camera, renderer, controls;
        let pallet3DGroup = new THREE.Group();
        let boxMeshMap = new Map(); // box.id -> THREE.Mesh

        // Layer Color Palette
        const LAYER_COLORS = [
            0x3b82f6, // Layer 1: Blue
            0x10b981, // Layer 2: Emerald
            0xf59e0b, // Layer 3: Amber
            0x8b5cf6, // Layer 4: Purple
            0xec4899, // Layer 5: Pink
            0x06b6d4  // Layer 6+: Cyan
        ];

        // --- 2. Initialize Firebase Connection ---
        function initFirebase() {
            const statusBadge = document.getElementById('status-badge');
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                isFirebaseLive = true;
                
                statusBadge.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                    <span class="text-emerald-400">CLOUD LIVE</span>
                `;

                // Realtime Sync Listener
                db.collection('pallet_system').doc('current_state')
                  .onSnapshot((doc) => {
                      if (doc.exists && doc.data().pallets) {
                          palletsData = doc.data().pallets;
                      } else {
                          if (palletsData.length === 0) createInitialData();
                      }
                      updateAll();
                  }, (err) => {
                      console.warn("Firestore listener fallback to local:", err);
                      enableLocalStorageFallback();
                  });

            } catch (error) {
                console.warn("Firebase Init failed, using Local Storage:", error);
                enableLocalStorageFallback();
            }
        }

        function enableLocalStorageFallback() {
            isFirebaseLive = false;
            const statusBadge = document.getElementById('status-badge');
            statusBadge.innerHTML = `
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                <span class="text-amber-400">LOCAL STORAGE MODE</span>
            `;
            loadFromLocalStorage();
        }

        function createInitialData() {
            palletsData = [
                { id: 'P1', name: 'พาเลท A (โซน 1)', boxes: [] },
                { id: 'P2', name: 'พาเลท B (โซน 1)', boxes: [] },
                { id: 'P3', name: 'พาเลท C (โซน 2)', boxes: [] }
            ];
            saveData();
        }

        function saveData() {
            if (isFirebaseLive && db) {
                db.collection('pallet_system').doc('current_state').set({
                    pallets: palletsData,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }).catch(err => {
                    console.error("Save to Cloud Failed:", err);
                    saveToLocalStorage();
                });
            } else {
                saveToLocalStorage();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('pallet_system_data', JSON.stringify(palletsData));
            updateAll();
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('pallet_system_data');
            if (saved) {
                try {
                    palletsData = JSON.parse(saved);
                } catch(e) {
                    createInitialData();
                }
            } else {
                createInitialData();
            }
            updateAll();
        }

        // --- 3. Three.js 3D Scene Setup ---
        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);
            scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 18, 26);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera under floor
            controls.minDistance = 5;
            controls.maxDistance = 60;

            // Lighting Setup
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(15, 25, 15);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 80;
            const d = 25;
            dirLight.shadow.camera.left = -d;
            dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d;
            dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.3);
            fillLight.position.set(-15, 10, -15);
            scene.add(fillLight);

            // Ground Grid
            const gridHelper = new THREE.GridHelper(60, 30, 0x38bdf8, 0x1e293b);
            gridHelper.position.y = -0.01;
            scene.add(gridHelper);

            scene.add(pallet3DGroup);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 4. Render 3D Objects & Stacking Logic ---
        function render3DScene() {
            // Clear existing meshes
            while(pallet3DGroup.children.length > 0) { 
                const obj = pallet3DGroup.children[0];
                pallet3DGroup.remove(obj);
            }
            boxMeshMap.clear();

            // Dimensions Setup
            const palletWidth = 3.6;
            const palletLength = 3.6;
            const palletHeight = 0.4;

            const boxWidth = 1.6;
            const boxLength = 1.6;
            const boxHeight = 1.2;
            const gap = 0.15;

            // Layout 3 Pallets per row in Grid
            const cols = 3;
            const spacingX = 5.5;
            const spacingZ = 5.5;

            // 2x2 Grid Offsets per Pallet Layer
            const localOffsets = [
                { x: -(boxWidth / 2 + gap / 2), z: -(boxLength / 2 + gap / 2) }, // Slot 1: Top-Left
                { x:  (boxWidth / 2 + gap / 2), z: -(boxLength / 2 + gap / 2) }, // Slot 2: Top-Right
                { x: -(boxWidth / 2 + gap / 2), z:  (boxLength / 2 + gap / 2) }, // Slot 3: Bottom-Left
                { x:  (boxWidth / 2 + gap / 2), z:  (boxLength / 2 + gap / 2) }  // Slot 4: Bottom-Right
            ];

            palletsData.forEach((pallet, pIndex) => {
                const col = pIndex % cols;
                const row = Math.floor(pIndex / cols);
                const posX = (col - 1) * spacingX;
                const posZ = row * spacingZ;

                // Build Wooden Pallet Mesh
                const palletMesh = createPalletMesh(palletWidth, palletHeight, palletLength);
                palletMesh.position.set(posX, palletHeight / 2, posZ);
                palletMesh.userData = { palletId: pallet.id };
                pallet3DGroup.add(palletMesh);

                // Build Boxes on Pallet (4 per layer, then stack)
                (pallet.boxes || []).forEach((box, bIndex) => {
                    const layerIndex = Math.floor(bIndex / 4);
                    const slotIndex = bIndex % 4;

                    const boxX = posX + localOffsets[slotIndex].x;
                    const boxY = palletHeight + (layerIndex * boxHeight) + (boxHeight / 2);
                    const boxZ = posZ + localOffsets[slotIndex].z;

                    const colorHex = LAYER_COLORS[layerIndex % LAYER_COLORS.length];
                    const boxMesh = createBoxMesh(boxWidth, boxHeight, boxLength, colorHex, box.label || 'ลังไม่มีชื่อ');
                    
                    boxMesh.position.set(boxX, boxY, boxZ);
                    boxMesh.userData = { 
                        boxId: box.id, 
                        palletId: pallet.id, 
                        label: box.label,
                        originalColor: colorHex,
                        layerIndex: layerIndex + 1
                    };

                    pallet3DGroup.add(boxMesh);
                    boxMeshMap.set(box.id, boxMesh);
                });
            });
        }

        function createPalletMesh(w, h, l) {
            const group = new THREE.Group();
            const woodMat = new THREE.MeshStandardMaterial({ color: 0xc2410c, roughness: 0.8 });

            // Top Planks
            const plankCount = 5;
            const plankWidth = w / plankCount - 0.05;
            for(let i=0; i<plankCount; i++) {
                const plankGeo = new THREE.BoxGeometry(plankWidth, 0.08, l);
                const plank = new THREE.Mesh(plankGeo, woodMat);
                plank.position.x = -w/2 + plankWidth/2 + i * (plankWidth + 0.05);
                plank.position.y = h/2 - 0.04;
                plank.castShadow = true;
                plank.receiveShadow = true;
                group.add(plank);
            }

            // Bottom Support Blocks
            const blockGeo = new THREE.BoxGeometry(w, h - 0.08, l * 0.2);
            const block = new THREE.Mesh(blockGeo, woodMat);
            block.position.y = -0.04;
            block.castShadow = true;
            block.receiveShadow = true;
            group.add(block);

            return group;
        }

        function createBoxMesh(w, h, l, colorHex, labelText) {
            const geometry = new THREE.BoxGeometry(w, h, l);
            const material = new THREE.MeshStandardMaterial({
                color: colorHex,
                roughness: 0.4,
                metalness: 0.1,
                transparent: true,
                opacity: 1.0
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            // Black Edges Outline
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x0f172a, linewidth: 2 });
            const line = new THREE.LineSegments(edges, lineMat);
            mesh.add(line);

            // Canvas Label Texture on Box Side
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 256, 128);
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#0284c7';
            ctx.strokeRect(0, 0, 256, 128);

            ctx.fillStyle = '#0f172a';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Text Wrap Handling
            const text = labelText.length > 14 ? labelText.substring(0, 12) + '...' : labelText;
            ctx.fillText(text, 128, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const labelGeo = new THREE.PlaneGeometry(w * 0.85, h * 0.55);
            const labelMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });

            // Front Label
            const labelFront = new THREE.Mesh(labelGeo, labelMat);
            labelFront.position.z = l / 2 + 0.01;
            mesh.add(labelFront);

            // Back Label
            const labelBack = new THREE.Mesh(labelGeo, labelMat);
            labelBack.position.z = -(l / 2 + 0.01);
            labelBack.rotation.y = Math.PI;
            mesh.add(labelBack);

            return mesh;
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            // Handle Search Highlight Animation (Pulsing Effect)
            searchPulseTime += 0.05;
            const searchInput = document.getElementById('search-input');
            const query = searchInput.value.trim().toLowerCase();

            boxMeshMap.forEach((mesh, boxId) => {
                if (query.length > 0) {
                    if (highlightedBoxIds.has(boxId)) {
                        // Highlighted Box: Glowing Yellow & Pulsing Opacity/Scale
                        const scaleFactor = 1 + Math.sin(searchPulseTime * 4) * 0.03;
                        mesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
                        mesh.material.color.setHex(0xfacc15); // Neon Yellow
                        mesh.material.opacity = 1.0;
                    } else {
                        // Non-matching Box: Semi-transparent
                        mesh.scale.set(1, 1, 1);
                        mesh.material.color.setHex(mesh.userData.originalColor);
                        mesh.material.opacity = 0.25;
                    }
                } else {
                    // Reset Normal Appearance
                    mesh.scale.set(1, 1, 1);
                    mesh.material.color.setHex(mesh.userData.originalColor);
                    mesh.material.opacity = 1.0;
                }
            });

            renderer.render(scene, camera);
        }

        // --- 5. UI Updates & Interaction Logic ---
        function updateAll() {
            render3DScene();
            updateUI();
            handleSearch();
        }

        function updateUI() {
            // Update Select Dropdown
            const selectPallet = document.getElementById('select-pallet');
            selectPallet.innerHTML = '';

            if (palletsData.length === 0) {
                const opt = document.createElement('option');
                opt.text = '-- กรุณาเพิ่มพาเลท --';
                selectPallet.add(opt);
            } else {
                palletsData.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.text = `${p.name} (${p.boxes ? p.boxes.length : 0} ลัง)`;
                    selectPallet.add(opt);
                });
            }

            // Update Pallet Count Badge
            document.getElementById('pallet-count-badge').textContent = `${palletsData.length} พาเลท`;

            // Update Pallet List Cards
            const container = document.getElementById('pallet-list-container');
            container.innerHTML = '';

            palletsData.forEach((pallet) => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/90 border border-slate-700/80 rounded-xl p-3 flex flex-col gap-2.5 hover:border-slate-500 transition shadow-md";

                const boxCount = pallet.boxes ? pallet.boxes.length : 0;
                const layerCount = Math.ceil(boxCount / 4);

                let boxesHTML = '';
                if (boxCount === 0) {
                    boxesHTML = `<p class="text-xs text-slate-500 italic py-1">ไม่มีลังบนพาเลทนี้</p>`;
                } else {
                    boxesHTML = pallet.boxes.map((b, idx) => {
                        const layer = Math.floor(idx / 4) + 1;
                        return `
                            <div class="flex justify-between items-center text-xs bg-slate-800/80 px-2.5 py-1.5 rounded-lg border border-slate-700/50">
                                <div class="flex items-center gap-1.5 truncate mr-1">
                                    <span class="w-2 h-2 rounded-full" style="background-color: #${LAYER_COLORS[(layer-1)%LAYER_COLORS.length].toString(16)}"></span>
                                    <span class="text-slate-200 truncate" title="${b.label}">${b.label}</span>
                                </div>
                                <div class="flex items-center gap-2 shrink-0">
                                    <span class="text-[10px] text-slate-400 bg-slate-900 px-1.5 py-0.5 rounded">ชั้น ${layer}</span>
                                    <button onclick="removeBox('${pallet.id}', '${b.id}')" class="text-rose-400 hover:text-rose-300 transition">
                                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    }).join('');
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <div>
                            <h3 class="text-xs font-bold text-cyan-300">${pallet.name}</h3>
                            <p class="text-[10px] text-slate-400">${boxCount} ลัง (${layerCount} ชั้น)</p>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="focusPallet('${pallet.id}')" title="ซูมกล้องไปที่พาเลทนี้" class="p-1 text-slate-400 hover:text-cyan-400 transition">
                                <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            </button>
                            <button onclick="removePallet('${pallet.id}')" title="ลบพาเลท" class="p-1 text-slate-400 hover:text-rose-400 transition">
                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1.5 max-h-36 overflow-y-auto custom-scrollbar pr-0.5">
                        ${boxesHTML}
                    </div>
                `;

                container.appendChild(card);
            });

            lucide.createIcons();
        }

        // --- 6. Event Handlers & User Actions ---
        function addPallet() {
            const name = prompt("กรุณาระบุชื่อพาเลท / โซนจัดเก็บ:", `พาเลท ${String.fromCharCode(65 + palletsData.length)}`);
            if (!name) return;

            const newPallet = {
                id: 'P_' + Date.now(),
                name: name.trim(),
                boxes: []
            };

            palletsData.push(newPallet);
            saveData();
        }

        function removePallet(palletId) {
            if (!confirm("คุณแน่ใจหรือไม่ที่จะลบพาเลทนี้พร้อมลังเอกสารทั้งหมด?")) return;
            palletsData = palletsData.filter(p => p.id !== palletId);
            saveData();
        }

        function addBox() {
            const selectPallet = document.getElementById('select-pallet');
            const inputLabel = document.getElementById('input-box-label');
            
            const palletId = selectPallet.value;
            const label = inputLabel.value.trim();

            if (!palletId || selectPallet.options[0].text.includes('--')) {
                alert("กรุณาเพิ่มพาเลทก่อนทำการวางกล่อง");
                return;
            }

            if (!label) {
                alert("กรุณากรอกชื่อข้างกล่องหรือรหัสเอกสาร");
                return;
            }

            const pallet = palletsData.find(p => p.id === palletId);
            if (pallet) {
                if (!pallet.boxes) pallet.boxes = [];
                pallet.boxes.push({
                    id: 'B_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    label: label
                });
                inputLabel.value = '';
                saveData();
            }
        }

        function removeBox(palletId, boxId) {
            const pallet = palletsData.find(p => p.id === palletId);
            if (pallet && pallet.boxes) {
                pallet.boxes = pallet.boxes.filter(b => b.id !== boxId);
                saveData();
            }
        }

        // Search System
        function handleSearch() {
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');
            const resultsList = document.getElementById('search-results-list');
            const query = searchInput.value.trim().toLowerCase();

            highlightedBoxIds.clear();
            resultsList.innerHTML = '';

            if (query.length > 0) {
                searchClear.classList.remove('hidden');
                resultsList.classList.remove('hidden');

                let matchCount = 0;
                palletsData.forEach(pallet => {
                    (pallet.boxes || []).forEach((box, idx) => {
                        if (box.label.toLowerCase().includes(query)) {
                            highlightedBoxIds.add(box.id);
                            matchCount++;

                            const layer = Math.floor(idx / 4) + 1;
                            const item = document.createElement('div');
                            item.className = "flex justify-between items-center bg-slate-800/90 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600 text-xs cursor-pointer transition";
                            item.onclick = () => focusBox(box.id, pallet.id);
                            item.innerHTML = `
                                <div class="truncate mr-2">
                                    <span class="font-medium text-amber-300">${box.label}</span>
                                    <span class="text-[10px] text-slate-400 block">${pallet.name} • ชั้น ${layer}</span>
                                </div>
                                <i data-lucide="locate" class="w-3.5 h-3.5 text-cyan-400 shrink-0"></i>
                            `;
                            resultsList.appendChild(item);
                        }
                    });
                });

                if (matchCount === 0) {
                    resultsList.innerHTML = `<p class="text-xs text-slate-400 italic p-1.5 text-center">ไม่พบกล่องที่ตรงกับคำค้นหา</p>`;
                }
            } else {
                searchClear.classList.add('hidden');
                resultsList.classList.add('hidden');
            }

            lucide.createIcons();
        }

        // Camera Focus Helpers
        function focusPallet(palletId) {
            const pIndex = palletsData.findIndex(p => p.id === palletId);
            if (pIndex === -1) return;

            const cols = 3;
            const spacingX = 5.5;
            const spacingZ = 5.5;

            const col = pIndex % cols;
            const row = Math.floor(pIndex / cols);
            const targetX = (col - 1) * spacingX;
            const targetZ = row * spacingZ;

            // Smooth Camera Transition
            const duration = 1000;
            const startPos = camera.position.clone();
            const startTarget = controls.target.clone();

            const endTarget = new THREE.Vector3(targetX, 1.5, targetZ);
            const endPos = new THREE.Vector3(targetX, 8, targetZ + 12);

            const startTime = performance.now();

            function animateCamera(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2; // Ease in-out

                camera.position.lerpVectors(startPos, endPos, easeProgress);
                controls.target.lerpVectors(startTarget, endTarget, easeProgress);
                controls.update();

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }

            requestAnimationFrame(animateCamera);
        }

        function focusBox(boxId, palletId) {
            focusPallet(palletId);
        }

        // Export/Import JSON Functions
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(palletsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `pallet_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        palletsData = importedData;
                        saveData();
                        alert("นำเข้าข้อมูลสำเร็จเรียบร้อย!");
                    } else {
                        alert("รูปแบบไฟล์ JSON ไม่ถูกต้อง");
                    }
                } catch (err) {
                    alert("เกิดข้อผิดพลาดในการอ่านไฟล์ JSON");
                }
            };
            reader.readAsText(file);
        }

        function clearAllData() {
            if (confirm("คุณแน่ใจหรือไม่ที่จะล้างข้อมูลพาเลทและกล่องทั้งหมด?")) {
                palletsData = [];
                saveData();
            }
        }

        // --- 7. DOM Event Listeners Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            init3D();
            initFirebase();

            // Button Event Bindings
            document.getElementById('btn-add-pallet').addEventListener('click', addPallet);
            document.getElementById('btn-add-box').addEventListener('click', addBox);
            
            // Search Event Bindings
            const searchInput = document.getElementById('search-input');
            const searchClear = document.getElementById('search-clear');

            searchInput.addEventListener('input', handleSearch);
            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                handleSearch();
            });

            // Enter Key Shortcut to Add Box
            document.getElementById('input-box-label').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addBox();
            });

            // Import / Export / Clear Bindings
            document.getElementById('btn-export').addEventListener('click', exportJSON);
            document.getElementById('btn-import-trigger').addEventListener('click', () => {
                document.getElementById('file-import').click();
            });
            document.getElementById('file-import').addEventListener('change', importJSON);
            document.getElementById('btn-clear-all').addEventListener('click', clearAllData);

            lucide.createIcons();
        });
    </script>
</body>
</html>
