<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pallet & Box Manager - Search Enabled</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }
    /* Custom Scrollbar for Sidebar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex overflow-hidden">

  <!-- Status Indicator Badge -->
  <div class="absolute top-4 left-4 z-20 flex items-center gap-2 bg-slate-900/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-slate-700/60 shadow-lg text-xs font-semibold">
    <div id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></div>
    <span id="statusText" class="text-slate-300">INITIALIZING...</span>
  </div>

  <!-- Main Canvas Container for 3D Viewport -->
  <div id="canvas-container" class="relative flex-1 h-full w-full bg-slate-950 cursor-grab active:cursor-grabbing">
    <!-- Top-Right Search Overlay Quick Info -->
    <div id="searchMatchBanner" class="hidden absolute top-4 left-1/2 -translate-x-1/2 z-20 bg-emerald-500/20 backdrop-blur-md border border-emerald-500/50 text-emerald-300 px-4 py-2 rounded-xl shadow-2xl flex items-center gap-2 text-sm font-medium animate-bounce">
      <i data-lucide="search-check" class="w-5 h-5 text-emerald-400"></i>
      <span>พบกล่องที่ตรงกับคำค้นหา <strong id="matchCount" class="text-emerald-200 underline font-bold text-base">0</strong> กล่อง</span>
    </div>
  </div>

  <!-- Sidebar Overlay Toggle for Mobile -->
  <button id="toggleSidebarBtn" class="lg:hidden absolute bottom-5 right-5 z-30 p-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full shadow-2xl transition-all">
    <i data-lucide="menu" class="w-6 h-6"></i>
  </button>

  <!-- Control Sidebar Panel -->
  <aside id="sidebar" class="fixed lg:relative top-0 right-0 h-full w-80 md:w-96 bg-slate-900/95 backdrop-blur-xl border-l border-slate-800 z-20 flex flex-col transition-transform duration-300 translate-x-full lg:translate-x-0 shadow-2xl">
    
    <!-- Header & Search Box Section -->
    <div class="p-5 border-b border-slate-800 space-y-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="p-2 bg-indigo-600/20 rounded-lg text-indigo-400 border border-indigo-500/30">
            <i data-lucide="boxes" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="font-bold text-slate-100 text-lg leading-tight">Pallet & Box 3D</h1>
            <p class="text-xs text-slate-400">ระบบจัดการตำแหน่งกล่องบนพาเลท</p>
          </div>
        </div>
        <button id="closeSidebarBtn" class="lg:hidden text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- Real-time Search Box Input -->
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
          <i data-lucide="search" class="w-4 h-4"></i>
        </div>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="ค้นหาชื่อกล่อง / แฟ้ม..." 
          class="w-full pl-9 pr-8 py-2 bg-slate-800/90 border border-slate-700/80 rounded-xl text-sm text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-amber-500/50 focus:border-amber-500 transition-all"
        />
        <button id="clearSearchBtn" class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-white">
          <i data-lucide="x-circle" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Actions & Pallets List Scrollable Area -->
    <div class="flex-1 overflow-y-auto p-5 space-y-5">
      
      <!-- Primary Actions -->
      <div class="grid grid-cols-2 gap-3">
        <button id="addPalletBtn" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 px-3 rounded-xl font-medium text-sm transition-all shadow-md active:scale-95">
          <i data-lucide="plus-square" class="w-4 h-4"></i>
          เพิ่มพาเลท
        </button>
        <button id="resetViewBtn" class="flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 py-2.5 px-3 rounded-xl font-medium text-sm transition-all border border-slate-700 active:scale-95">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          รีเซ็ตมุมมอง
        </button>
      </div>

      <!-- Pallets List Tree View -->
      <div class="space-y-3">
        <div class="flex items-center justify-between text-xs font-semibold text-slate-400 uppercase tracking-wider">
          <span>รายการพาเลท (<span id="palletCount">0</span>)</span>
          <span class="text-[10px] text-slate-500">คลิกเปิดเพื่อดูและเพิ่มกล่อง</span>
        </div>
        <div id="palletsContainer" class="space-y-3">
          <!-- Dynamic Pallet Accordion Cards generated via JS -->
        </div>
      </div>
    </div>

    <!-- Footer: Cloud Sync & Backup Buttons -->
    <div class="p-4 border-t border-slate-800 bg-slate-950/50 space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <button id="exportBtn" class="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-xs font-medium border border-slate-700 transition">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Export JSON
        </button>
        <button id="importBtn" class="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-lg text-xs font-medium border border-slate-700 transition">
          <i data-lucide="upload" class="w-3.5 h-3.5"></i> Import JSON
        </button>
      </div>
      <input type="file" id="importFileInput" accept=".json" class="hidden" />
    </div>
  </aside>

  <!-- Edit Box Label Modal -->
  <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-base font-semibold text-slate-100 flex items-center gap-2">
          <i data-lucide="edit-3" class="w-4 h-4 text-amber-400"></i>
          แก้ไขข้อความป้ายข้างกล่อง
        </h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">ข้อความที่จะติดข้างกล่อง (Label/Name)</label>
        <input 
          type="text" 
          id="modalBoxLabelInput" 
          class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-slate-100 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/50"
          placeholder="พิมพ์ชื่อแฟ้มหรือรหัสกล่อง..."
        />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button id="cancelModalBtn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm rounded-xl font-medium">ยกเลิก</button>
        <button id="saveModalBtn" class="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm rounded-xl font-bold">บันทึก</button>
      </div>
    </div>
  </div>

  <!-- Firebase Integration -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // App State
    let palletsData = [];
    let searchKeyword = "";
    let isCloudLive = false;
    let editingTarget = null; // { palletId, boxId }

    // Firebase Config Check
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'pallet-box-manager-default';
    let firebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        firebaseConfig = JSON.parse(__firebase_config);
      }
    } catch (e) {
      console.warn("Firebase Config parse error fallback to local storage:", e);
    }

    let db = null;
    let auth = null;
    let docRef = null;

    // --- THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(12, 12, 16);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // OrbitControls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 + 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 60;
    controls.target.set(3, 0, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(20, 30, 20);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.bias = -0.0001;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.3);
    fillLight.position.set(-20, 15, -20);
    scene.add(fillLight);

    // Floor Grid
    const gridHelper = new THREE.GridHelper(60, 60, 0x334155, 0x1e293b);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    // Groups holding 3D meshes
    const palletsGroup = new THREE.Group();
    scene.add(palletsGroup);

    // Map for high-efficiency box mesh tracking during animation/highlighting
    let boxMeshRegistry = [];

    // Dimensions
    const PALLET_W = 2.4, PALLET_L = 2.4, PALLET_H = 0.25;
    const BOX_W = 1.1, BOX_L = 1.1, BOX_H = 0.8;
    const GRID_COLS = 3; // 3 Columns arrangement

    // --- CANVAS TEXTURE GENERATOR FOR BOX LABELS ---
    function createBoxLabelTexture(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      // Cardboard-like background
      ctx.fillStyle = '#c29b68';
      ctx.fillRect(0, 0, 512, 256);

      // White Label Sticker area
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(20, 20, 472, 216);

      // Border line
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 6;
      ctx.strokeRect(26, 26, 460, 204);

      // Label Header / Icon accent
      ctx.fillStyle = '#4f46e5';
      ctx.fillRect(26, 26, 460, 36);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('FILE ARCHIVE BOX', 256, 52);

      // Main Text
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 36px Inter, sans-serif';
      
      // Auto-wrap text if long
      const maxTextWidth = 430;
      let words = text.split(' ');
      let line = '';
      let y = 130;

      for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxTextWidth && n > 0) {
          ctx.fillText(line, 256, y);
          line = words[n] + ' ';
          y += 42;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, 256, y);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // --- 3D MESH GENERATORS ---
    // Pallet Mesh Generator
    function createPalletMesh() {
      const group = new THREE.Group();
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x855e42, roughness: 0.8 });

      // Top planks
      for (let i = -1; i <= 1; i += 0.5) {
        const plank = new THREE.Mesh(new THREE.BoxGeometry(PALLET_W, 0.04, 0.35), woodMat);
        plank.position.set(0, PALLET_H - 0.02, i * 0.75);
        plank.castShadow = true;
        plank.receiveShadow = true;
        group.add(plank);
      }

      // Support Blocks
      for (let x of [-1, 0, 1]) {
        for (let z of [-1, 0, 1]) {
          const block = new THREE.Mesh(new THREE.BoxGeometry(0.3, PALLET_H - 0.08, 0.3), woodMat);
          block.position.set(x * 0.95, (PALLET_H - 0.08)/2 + 0.04, z * 0.95);
          block.castShadow = true;
          block.receiveShadow = true;
          group.add(block);
        }
      }

      // Bottom Planks
      for (let z of [-0.95, 0, 0.95]) {
        const bottomPlank = new THREE.Mesh(new THREE.BoxGeometry(PALLET_W, 0.04, 0.3), woodMat);
        bottomPlank.position.set(0, 0.02, z);
        bottomPlank.castShadow = true;
        bottomPlank.receiveShadow = true;
        group.add(bottomPlank);
      }

      return group;
    }

    // Box Mesh Generator
    function createBoxMesh(boxData, isHighlighted) {
      const boxGeo = new THREE.BoxGeometry(BOX_W, BOX_H, BOX_L);
      const labelTexture = createBoxLabelTexture(boxData.label);

      // Cardboard side materials
      const cardboardMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.7 });
      
      // Front and Back sides with Canvas Text Texture
      const labelMat = new THREE.MeshStandardMaterial({ map: labelTexture, roughness: 0.5 });

      // Highlight Glowing Material override
      const highlightMat = new THREE.MeshStandardMaterial({
        color: 0xfacc15, // Neon Gold
        emissive: 0xeab308,
        emissiveIntensity: 0.6,
        roughness: 0.2
      });

      const highlightLabelMat = new THREE.MeshStandardMaterial({
        map: labelTexture,
        color: 0xfef08a,
        emissive: 0xca8a04,
        emissiveIntensity: 0.5
      });

      let materials;
      if (isHighlighted) {
        materials = [
          highlightMat, highlightMat,
          highlightMat, highlightMat,
          highlightLabelMat, highlightLabelMat // Front/Back
        ];
      } else {
        materials = [
          cardboardMat, cardboardMat,
          cardboardMat, cardboardMat,
          labelMat, labelMat
        ];
      }

      const mesh = new THREE.Mesh(boxGeo, materials);
      mesh.castShadow = true;
      mesh.receiveShadow = true;

      // Subtle Box Edge Lines
      const edges = new THREE.EdgesGeometry(boxGeo);
      const lineMat = new THREE.LineBasicMaterial({ 
        color: isHighlighted ? 0xfef08a : 0x78350f, 
        linewidth: 1.5 
      });
      const wireframe = new THREE.LineSegments(edges, lineMat);
      mesh.add(wireframe);

      return mesh;
    }

    // Render & Rebuild Entire 3D Scene based on State
    function render3DScene() {
      // Clear previous pallet meshes
      while (palletsGroup.children.length > 0) {
        const child = palletsGroup.children[0];
        palletsGroup.remove(child);
      }
      boxMeshRegistry = [];

      let totalMatchedBoxes = 0;
      const normalizedKeyword = searchKeyword.trim().toLowerCase();

      palletsData.forEach((pallet, pIdx) => {
        // Calculate Grid Position (3 columns)
        const row = Math.floor(pIdx / GRID_COLS);
        const col = pIdx % GRID_COLS;
        const posX = col * (PALLET_W + 1.2);
        const posZ = row * (PALLET_L + 1.2);

        // Pallet Group
        const pGroup = new THREE.Group();
        pGroup.position.set(posX, 0, posZ);

        // Add Pallet Base Mesh
        const palletMesh = createPalletMesh();
        pGroup.add(palletMesh);

        // Stack Boxes on Pallet
        pallet.boxes.forEach((box, bIdx) => {
          const isMatched = normalizedKeyword !== "" && box.label.toLowerCase().includes(normalizedKeyword);
          if (isMatched) totalMatchedBoxes++;

          const boxMesh = createBoxMesh(box, isMatched);
          // Y calculation based on box height and stacking
          const boxY = PALLET_H + (bIdx * BOX_H) + (BOX_H / 2);
          boxMesh.position.set(0, boxY, 0);

          pGroup.add(boxMesh);

          // Register box for animation loop if highlighted
          boxMeshRegistry.push({
            mesh: boxMesh,
            isMatched,
            originalY: boxY,
            seed: pIdx * 10 + bIdx
          });
        });

        palletsGroup.add(pGroup);
      });

      // Update Search Match Banner
      const matchBanner = document.getElementById('searchMatchBanner');
      const matchCount = document.getElementById('matchCount');
      if (normalizedKeyword !== "") {
        matchBanner.classList.remove('hidden');
        matchCount.innerText = totalMatchedBoxes;
      } else {
        matchBanner.classList.add('hidden');
      }
    }

    // --- UI RENDER & CONTROLS ---
    function renderUI() {
      const container = document.getElementById('palletsContainer');
      const palletCountEl = document.getElementById('palletCount');
      palletCountEl.innerText = palletsData.length;

      container.innerHTML = '';

      if (palletsData.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-500 border border-dashed border-slate-800 rounded-2xl">
            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            <p class="text-sm">ยังไม่มีพาเลทในระบบ</p>
            <p class="text-xs">กดปุ่ม "เพิ่มพาเลท" ด้านบนเพื่อเริ่มจัดวาง</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      const normalizedKeyword = searchKeyword.trim().toLowerCase();

      palletsData.forEach((pallet, pIdx) => {
        const palletCard = document.createElement('div');
        palletCard.className = "bg-slate-800/60 border border-slate-700/60 rounded-xl overflow-hidden transition-all";

        let boxesHTML = '';
        pallet.boxes.forEach((box, bIdx) => {
          const isMatched = normalizedKeyword !== "" && box.label.toLowerCase().includes(normalizedKeyword);
          
          boxesHTML += `
            <div class="flex items-center justify-between p-2 rounded-lg ${isMatched ? 'bg-amber-500/20 border border-amber-500/50' : 'bg-slate-900/50'} text-xs gap-2">
              <div class="flex items-center gap-2 truncate flex-1">
                <span class="w-5 h-5 rounded-md bg-slate-800 text-slate-400 font-bold flex items-center justify-center text-[10px] shrink-0">
                  L${bIdx + 1}
                </span>
                <span class="truncate font-medium ${isMatched ? 'text-amber-300 font-bold' : 'text-slate-200'}">
                  ${escapeHTML(box.label)}
                </span>
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button onclick="window.appEditBoxLabel('${pallet.id}', '${box.id}', '${escapeHTML(box.label)}')" class="p-1 hover:bg-slate-700 text-slate-400 hover:text-amber-400 rounded transition">
                  <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                </button>
                <button onclick="window.appRemoveBox('${pallet.id}', '${box.id}')" class="p-1 hover:bg-slate-700 text-slate-400 hover:text-rose-400 rounded transition">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>
            </div>
          `;
        });

        palletCard.innerHTML = `
          <div class="p-3 bg-slate-800 flex items-center justify-between border-b border-slate-700/50">
            <div class="flex items-center gap-2">
              <i data-lucide="box" class="w-4 h-4 text-indigo-400"></i>
              <span class="font-bold text-sm text-slate-100">พาเลท #${pIdx + 1}</span>
              <span class="text-xs text-slate-400">(${pallet.boxes.length} ลัง)</span>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="window.appAddBox('${pallet.id}')" class="flex items-center gap-1 bg-indigo-600/30 hover:bg-indigo-600 text-indigo-300 hover:text-white px-2 py-1 rounded-lg text-xs transition border border-indigo-500/30">
                <i data-lucide="plus" class="w-3 h-3"></i> วางกล่อง
              </button>
              <button onclick="window.appRemovePallet('${pallet.id}')" class="p-1 text-slate-400 hover:text-rose-400 hover:bg-slate-700/50 rounded transition">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
          <div class="p-2 space-y-1.5 max-h-48 overflow-y-auto">
            ${pallet.boxes.length === 0 ? '<p class="text-center text-xs text-slate-500 py-2">ยังไม่มีกล่องวางบนพาเลทนี้</p>' : boxesHTML}
          </div>
        `;

        container.appendChild(palletCard);
      });

      lucide.createIcons();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    // --- DATA STATE ACTIONS ---
    function saveData() {
      render3DScene();
      renderUI();

      if (isCloudLive && docRef) {
        setDoc(docRef, { pallets: palletsData, updatedAt: new Date().toISOString() }, { merge: true })
          .catch(err => console.error("Firestore sync error:", err));
      } else {
        localStorage.setItem('pallet_box_data_v2', JSON.stringify(palletsData));
      }
    }

    window.appAddPallet = function() {
      const newPallet = {
        id: 'pallet_' + Date.now(),
        boxes: [
          { id: 'box_' + Date.now() + '_1', label: 'แฟ้มเอกสารบัญชี 2026' }
        ]
      };
      palletsData.push(newPallet);
      saveData();
    };

    window.appRemovePallet = function(palletId) {
      palletsData = palletsData.filter(p => p.id !== palletId);
      saveData();
    };

    window.appAddBox = function(palletId) {
      const pallet = palletsData.find(p => p.id === palletId);
      if (pallet) {
        pallet.boxes.push({
          id: 'box_' + Date.now(),
          label: `ลังแฟ้มใหม่ #${pallet.boxes.length + 1}`
        });
        saveData();
      }
    };

    window.appRemoveBox = function(palletId, boxId) {
      const pallet = palletsData.find(p => p.id === palletId);
      if (pallet) {
        pallet.boxes = pallet.boxes.filter(b => b.id !== boxId);
        saveData();
      }
    };

    window.appEditBoxLabel = function(palletId, boxId, currentLabel) {
      editingTarget = { palletId, boxId };
      document.getElementById('modalBoxLabelInput').value = currentLabel;
      document.getElementById('editModal').classList.remove('hidden');
      document.getElementById('modalBoxLabelInput').focus();
    };

    // Modal Actions
    document.getElementById('saveModalBtn').addEventListener('click', () => {
      if (editingTarget) {
        const newLabel = document.getElementById('modalBoxLabelInput').value.trim() || 'ไม่มีชื่อแฟ้ม';
        const pallet = palletsData.find(p => p.id === editingTarget.palletId);
        if (pallet) {
          const box = pallet.boxes.find(b => b.id === editingTarget.boxId);
          if (box) {
            box.label = newLabel;
            saveData();
          }
        }
      }
      document.getElementById('editModal').classList.add('hidden');
    });

    document.getElementById('closeModalBtn').addEventListener('click', () => {
      document.getElementById('editModal').classList.add('hidden');
    });
    document.getElementById('cancelModalBtn').addEventListener('click', () => {
      document.getElementById('editModal').classList.add('hidden');
    });

    // Button event listeners
    document.getElementById('addPalletBtn').addEventListener('click', window.appAddPallet);

    document.getElementById('resetViewBtn').addEventListener('click', () => {
      camera.position.set(12, 12, 16);
      controls.target.set(3, 0, 0);
      controls.update();
    });

    // Realtime Search Listener
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.addEventListener('input', (e) => {
      searchKeyword = e.target.value;
      if (searchKeyword.length > 0) {
        clearSearchBtn.classList.remove('hidden');
      } else {
        clearSearchBtn.classList.add('hidden');
      }
      render3DScene();
      renderUI();
    });

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchKeyword = '';
      clearSearchBtn.classList.add('hidden');
      render3DScene();
      renderUI();
    });

    // JSON Export / Import
    document.getElementById('exportBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(palletsData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `pallet_layout_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });

    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            palletsData = imported;
            saveData();
          } else {
            alert('รูปแบบไฟล์ JSON ไม่ถูกต้อง');
          }
        } catch (err) {
          alert('ไม่สามารถอ่านไฟล์ JSON ได้');
        }
      };
      reader.readAsText(file);
    });

    // Mobile Sidebar Toggles
    const sidebar = document.getElementById('sidebar');
    document.getElementById('toggleSidebarBtn').addEventListener('click', () => {
      sidebar.classList.remove('translate-x-full');
    });
    document.getElementById('closeSidebarBtn').addEventListener('click', () => {
      sidebar.classList.add('translate-x-full');
    });

    // --- INITIALIZATION & FIREBASE SETUP ---
    async function initSystem() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      if (firebaseConfig) {
        try {
          const app = initializeApp(firebaseConfig);
          auth = getAuth(app);
          db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          docRef = doc(db, 'artifacts', appId, 'public', 'data', 'pallet_layout_db');

          onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().pallets) {
              palletsData = docSnap.data().pallets;
            } else {
              // Default Initial Data if cloud empty
              palletsData = [
                {
                  id: 'pallet_1',
                  boxes: [
                    { id: 'b1', label: 'แฟ้มบุคคล HR-2026' },
                    { id: 'b2', label: 'เอกสารบัญชีไตรมาส 1' },
                    { id: 'b3', label: 'สัญญาจัดซื้อ 2025-2026' }
                  ]
                },
                {
                  id: 'pallet_2',
                  boxes: [
                    { id: 'b4', label: 'รายงานการประชุมบริหาร' },
                    { id: 'b5', label: 'แฟ้มภาษีประจำปี' }
                  ]
                }
              ];
              setDoc(docRef, { pallets: palletsData });
            }
            isCloudLive = true;
            statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
            statusText.innerText = "CLOUD LIVE";
            statusText.className = "text-emerald-400 font-semibold";
            render3DScene();
            renderUI();
          }, (error) => {
            console.error("Firestore snapshot error:", error);
            fallbackToLocal();
          });

        } catch (e) {
          console.warn("Firebase Init failed, using local storage:", e);
          fallbackToLocal();
        }
      } else {
        fallbackToLocal();
      }
    }

    function fallbackToLocal() {
      isCloudLive = false;
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      statusDot.className = "w-2.5 h-2.5 rounded-full bg-amber-500";
      statusText.innerText = "LOCAL STORAGE";
      statusText.className = "text-amber-400 font-semibold";

      const local = localStorage.getItem('pallet_box_data_v2');
      if (local) {
        try {
          palletsData = JSON.parse(local);
        } catch(e) {
          palletsData = getDemoData();
        }
      } else {
        palletsData = getDemoData();
      }
      render3DScene();
      renderUI();
    }

    function getDemoData() {
      return [
        {
          id: 'pallet_1',
          boxes: [
            { id: 'b1', label: 'แฟ้มบุคคล HR-2026' },
            { id: 'b2', label: 'เอกสารบัญชีไตรมาส 1' }
          ]
        },
        {
          id: 'pallet_2',
          boxes: [
            { id: 'b3', label: 'สัญญาจัดซื้อ 2025-2026' }
          ]
        }
      ];
    }

    // --- ANIMATION LOOP ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Gentle floating/pulsing animation for matched search boxes
      boxMeshRegistry.forEach((item) => {
        if (item.isMatched) {
          // Subtle vertical floating motion
          item.mesh.position.y = item.originalY + Math.sin(elapsedTime * 4 + item.seed) * 0.08;
          // Pulse scale
          const scale = 1 + Math.sin(elapsedTime * 6 + item.seed) * 0.02;
          item.mesh.scale.set(scale, scale, scale);
        } else {
          item.mesh.position.y = item.originalY;
          item.mesh.scale.set(1, 1, 1);
        }
      });

      controls.update();
      renderer.render(scene, camera);
    }

    // Responsive Canvas Resize
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Start App
    initSystem();
    animate();
  </script>
</body>
</html>
